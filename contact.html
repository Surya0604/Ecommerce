<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/contact.css">
    <title>Hello, world!</title>
  </head>
  <body>
    <div class="container-fluid">
        <div class="row no-gutters">
            <div class="col-md-6">
                <div class="contact-form">
                    <h2>CONTACT US</h2>
                    <p>We're open for any suggestion or just to have a chat</p>
                    <address>
                        <strong>ADDRESS:</strong> 198 West 21th Street, Suite 721 New York NY 10016<br>
                        <strong>EMAIL:</strong> <a class="mail" href="mailto:info@yoursite.com">info@yoursite.com</a><br>
                        <strong>PHONE:</strong> + 1235 2355 98
                    </address>
                    <form>
                        <div class="form-group">
                            <input type="text" class="form-control" placeholder="Name">
                        </div>
                        <div class="form-group">
                            <input type="email" class="form-control" placeholder="Email">
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control" placeholder="Subject">
                        </div>
                        <div class="form-group">
                            <textarea class="form-control" rows="4" placeholder="Create a message here"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">SEND</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <div class="image-section">
                    <img src="assets/img/delivery.webp" alt="Window with plants" class="img-fluid">
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </body>
</html>
